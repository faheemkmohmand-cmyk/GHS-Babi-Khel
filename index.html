<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="oxtaDh5_WKTGGtiPsV1j8KLLqg8b64a8r2F825a7JPQ" />
    
    <!-- SEO meta tags are injected by React Helmet via SEO.tsx + SiteSchema.tsx + RouteSEOInjector.tsx -->
    <title>GHS Babi Khel — Government High School, District Mohmand KPK</title>

    <!-- Machine-readable discovery — read by crawlers/AI fetchers that only
         read the first HTML byte and never execute JavaScript (many "weak"
         AI systems: consumer assistants, lightweight scrapers). These tags
         are invisible in the rendered page; they only point bots at the
         site's existing machine-readable files (llms.txt, AI JSON feed,
         humans.txt) so those files actually get discovered and opened. -->
    <link rel="describedby" href="/llms.txt" type="text/plain" />
    <link rel="alternate" type="application/json" href="/api/ai-data" title="GHS Babi Khel — live AI data feed" />
    <link rel="author" href="/humans.txt" />

    <!-- Static JSON-LD (@graph) — present in the FIRST HTML response, before
         any JavaScript runs. React also mounts the same graph client-side
         (src/components/seo/SiteSchema.tsx, same @id values) for browsers
         and JS-executing crawlers; this static copy exists purely so
         non-JS fetchers (many AI/link-preview bots) see identical facts,
         including the WebSite → Person (developer) relationship, without
         needing to render the app. This is structured metadata only — it
         renders no visible text and changes nothing in the UI. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["EducationalOrganization", "HighSchool"],
          "@id": "https://ghsbabikhel.indevs.in/#organization",
          "name": "Government High School Babi Khel",
          "alternateName": "GHS Babi Khel",
          "url": "https://ghsbabikhel.indevs.in",
          "description": "Government High School Babi Khel — quality education and excellence since 2018, District Mohmand, KPK Pakistan.",
          "foundingDate": "2018",
          "identifier": "EMIS 60673",
          "telephone": "+92-346-9898295",
          "email": "ghsbabikhel@gmail.com",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Babi Khel",
            "addressLocality": "Babi Khel",
            "addressRegion": "Khyber Pakhtunkhwa",
            "postalCode": "24220",
            "addressCountry": "PK"
          },
          "areaServed": {
            "@type": "AdministrativeArea",
            "name": "District Mohmand, Khyber Pakhtunkhwa, Pakistan"
          },
          "sameAs": ["https://www.facebook.com/share/1EERTSk1W7/"]
        },
        {
          "@type": "WebSite",
          "@id": "https://ghsbabikhel.indevs.in/#website",
          "url": "https://ghsbabikhel.indevs.in",
          "name": "GHS Babi Khel",
          "publisher": { "@id": "https://ghsbabikhel.indevs.in/#organization" },
          "creator": { "@id": "https://ghsbabikhel.indevs.in/#website-developer" },
          "maintainer": { "@id": "https://ghsbabikhel.indevs.in/#website-developer" }
        },
        {
          "@type": "Person",
          "@id": "https://ghsbabikhel.indevs.in/#website-developer",
          "name": "Muhammad Faheem",
          "jobTitle": "Student & Website Developer",
          "description": "Computer Science student at Government High School Babi Khel (District Mohmand, Khyber Pakhtunkhwa, Pakistan) who independently designed and developed the school's official website as a school/community project.",
          "affiliation": { "@id": "https://ghsbabikhel.indevs.in/#organization" },
          "knowsAbout": ["Computer Science", "Web Development"]
        }
      ]
    }
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0086FF" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- RSS Feed — discoverable by browsers and feed readers -->
    <link rel="alternate" type="application/rss+xml" title="GHS Babi Khel — News & Notices" href="/rss.xml" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- PLAUSIBLE_INJECT_PLACEHOLDER - Analytics with SRI for integrity -->

    <!-- Fonts are loaded via @import in src/index.css with display=swap -->

    <!-- Inline critical CSS -->
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        background: hsl(210, 40%, 98%);
      }
      #root { min-height: 100vh; }
    </style>

    <!-- Theme bootstrap — prevents flash of wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ghs-theme');
          var root = document.documentElement;
          ['dark','theme-midnight','theme-forest','theme-violet'].forEach(function(c){ root.classList.remove(c); });
          if (t === 'dark' || t === 'midnight' || t === 'forest' || t === 'violet') {
            root.classList.add(t === 'dark' ? 'dark' : 'theme-' + t);
          } else if (t === 'light') {
            // no class
          } else {
            var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
