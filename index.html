<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="oxtaDh5_WKTGGtiPsV1j8KLLqg8b64a8r2F825a7JPQ" />
    
    <!-- SEO meta tags are injected by React Helmet via SEO.tsx + SiteSchema.tsx + RouteSEOInjector.tsx -->
    <title>GHS Babi Khel — Government High School, District Mohmand KPK</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0086FF" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- RSS Feed — discoverable by browsers and feed readers -->
    <link rel="alternate" type="application/rss+xml" title="GHS Babi Khel — News & Notices" href="/rss.xml" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- PLAUSIBLE_INJECT_PLACEHOLDER - Analytics with SRI for integrity -->

    <!-- Fonts are loaded via @import in src/index.css with display=swap -->

    <!-- Inline critical CSS -->
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        background: hsl(210, 40%, 98%);
      }
      #root { min-height: 100vh; }
    </style>

    <!-- Theme bootstrap — prevents flash of wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ghs-theme');
          var root = document.documentElement;
          ['dark','theme-midnight','theme-forest','theme-violet'].forEach(function(c){ root.classList.remove(c); });
          if (t === 'dark' || t === 'midnight' || t === 'forest' || t === 'violet') {
            root.classList.add(t === 'dark' ? 'dark' : 'theme-' + t);
          } else if (t === 'light') {
            // no class
          } else {
            var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
